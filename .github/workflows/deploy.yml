name: Publication du site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux nécessaires au déploiement GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Phase de recette : le site est servi dans un sous-répertoire, et ne doit
      # pas être indexé tant qu'il fait doublon avec aliamad.com.
      # À la bascule (phase 8), ces deux variables disparaissent et le site
      # repart à la racine du domaine définitif.
      - run: npm run build
        env:
          SITE_URL: https://aliamad-lab.github.io
          SITE_BASE: /aliamad-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
