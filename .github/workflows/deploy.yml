name: Publication du site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux nécessaires au déploiement GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le site est servi à la racine de www.aliamad.com. Les variables de
      # recette (SITE_URL, SITE_BASE) ont été retirées lors de la bascule : le
      # site n'est plus dans un sous-répertoire et redevient indexable.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
